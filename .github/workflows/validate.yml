name: Validar aventura
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python tools/manual.py --sync && python tools/maps.py && python tools/content.py && python tools/verify.py
      - run: python tools/verify-audio.py
      - run: python tools/manual.py && python tools/render-review.py && python tools/pdf-validate.py
      - run: node tools/build.mjs
